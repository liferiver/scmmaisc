server:
  port: 0

# H2（MySQL 模式）测试库：schema.sql 幂等建表，与生产结构一致
spring:
  datasource:
    url: jdbc:h2:mem:scmsim;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

# 测试永远走 Stub 语言模型（宪法 II：确定性、无网络）
llm:
  stub: true
