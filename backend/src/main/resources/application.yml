server:
  port: 8080

spring:
  application:
    name: scm-sim-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/scmmaisc?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # 启动时幂等执行建表脚本（CREATE TABLE IF NOT EXISTS）；场景数据由 ScenarioDataLoader 装载
      mode: always
      schema-locations: classpath:db/schema.sql
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

# 三期：多智能体讨论 LLM 接入（research.md §1/§10）
# 密钥仅走环境变量 LLM_API_KEY（不提交）；本地演示/测试用 llm.stub=true
llm:
  base-url: ${LLM_BASE_URL:http://localhost:8000/v1}
  model: ${LLM_MODEL:qwen2.5-72b-instruct}
  api-key: ${LLM_API_KEY:}
  timeout-seconds: 60
  stub: ${LLM_STUB:false}
