# SCMM-AISC 前端 Nginx 配置（Docker 部署）：
# 静态资源 + history 路由回退 + /api 反向代理到后端容器
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Docker 内嵌 DNS（容器重建后 IP 变化，静态解析会缓存旧 IP 导致 502；
    # resolver + 变量使 nginx 周期性重新解析 backend 服务名）
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream http://backend:8080;

    # API 反向代理 → 后端服务（docker compose 服务名 backend，容器内 8080）
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Vue Router history 模式回退（/scenarios/xxx、/compare 等刷新不 404）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
